apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rabbitmq.fullname" . }}-config
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
data:
  RABBITMQ_DEFAULT_USER: {{ .Values.global.rabbitmq.username | default .Values.env.RABBITMQ_DEFAULT_USER | quote }}
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_prometheus].
