apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mysql.fullname" . }}-config
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
data:
  MYSQL_DATABASE: {{ .Values.global.mysql.database | default .Values.env.MYSQL_DATABASE | quote }}
  MYSQL_USER: {{ .Values.global.mysql.user | default .Values.env.MYSQL_USER | quote }}
  my.cnf: |
    [mysqld]
    default_authentication_plugin=mysql_native_password
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
    max_connections=200
    connect_timeout=60
    wait_timeout=600
