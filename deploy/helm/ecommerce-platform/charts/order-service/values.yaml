replicaCount: 2

image:
  repository: ecommerce/order-service
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 3002

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

env:
  NODE_ENV: production
  PORT: 3002
  DB_HOST: ecommerce-mysql
  DB_PORT: 3306
  DB_NAME: ecommerce
  DB_USER: ecommerce_user
  RABBITMQ_HOST: ecommerce-rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: guest
