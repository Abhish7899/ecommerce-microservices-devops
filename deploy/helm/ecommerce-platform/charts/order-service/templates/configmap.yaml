apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "order-service.fullname" . }}-config
  labels:
    {{- include "order-service.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.service.port | quote }}
  NODE_ENV: {{ .Values.env.NODE_ENV | default "production" | quote }}
  DB_HOST: {{ .Values.global.mysql.host | default .Values.env.DB_HOST | quote }}
  DB_PORT: {{ .Values.global.mysql.port | default .Values.env.DB_PORT | quote }}
  DB_NAME: {{ .Values.global.mysql.database | default .Values.env.DB_NAME | quote }}
  DB_USER: {{ .Values.global.mysql.user | default .Values.env.DB_USER | quote }}
  RABBITMQ_HOST: {{ .Values.global.rabbitmq.host | default .Values.env.RABBITMQ_HOST | quote }}
  RABBITMQ_PORT: {{ .Values.global.rabbitmq.port | default .Values.env.RABBITMQ_PORT | quote }}
  RABBITMQ_USER: {{ .Values.global.rabbitmq.username | default .Values.env.RABBITMQ_USER | quote }}
  INVENTORY_SERVICE_URL: "http://{{ .Release.Name }}-inventory-service:3003"
