apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ecommerce-platform.sharedSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ecommerce-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.global.jwtSecret | quote }}
  MYSQL_ROOT_PASSWORD: {{ .Values.global.mysql.rootPassword | quote }}
  MYSQL_PASSWORD: {{ .Values.global.mysql.password | quote }}
  RABBITMQ_PASSWORD: {{ .Values.global.rabbitmq.password | quote }}
