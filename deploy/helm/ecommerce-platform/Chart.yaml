apiVersion: v2
name: ecommerce-platform
description: Production-grade Helm chart for E-Commerce Microservices Platform
type: application
version: 1.0.0
appVersion: "1.0.0"

dependencies:
  - name: api-gateway
    version: 1.0.0
    repository: "file://charts/api-gateway"
    condition: api-gateway.enabled
  - name: auth-service
    version: 1.0.0
    repository: "file://charts/auth-service"
    condition: auth-service.enabled
  - name: order-service
    version: 1.0.0
    repository: "file://charts/order-service"
    condition: order-service.enabled
  - name: inventory-service
    version: 1.0.0
    repository: "file://charts/inventory-service"
    condition: inventory-service.enabled
  - name: notification-service
    version: 1.0.0
    repository: "file://charts/notification-service"
    condition: notification-service.enabled
  - name: mysql
    version: 1.0.0
    repository: "file://charts/mysql"
    condition: mysql.enabled
  - name: redis
    version: 1.0.0
    repository: "file://charts/redis"
    condition: redis.enabled
  - name: rabbitmq
    version: 1.0.0
    repository: "file://charts/rabbitmq"
    condition: rabbitmq.enabled
